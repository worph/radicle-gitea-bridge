name: Build and Push Docker Image

# Produces ghcr.io/worph/radicle-gitea-bridge. `latest` follows main; a `vX.Y.Z` tag
# additionally produces X.Y.Z and X.Y, and every build is retrievable by its commit sha.
#
# Store apps pin an exact version rather than `latest`, so cutting a release means pushing
# a tag here and then bumping the image in the app listings that use it (the Radicle Gitea
# Bridge and IPCR Forge apps: both the service and the bridge-credentials init step).

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the image (optional, defaults to sha)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The whole bridge is two POSIX shell scripts, run by BusyBox sh in the image, so
      # ShellCheck in sh mode is the test suite. shellcheck is preinstalled on the runner.
      - name: ShellCheck
        run: shellcheck --shell=sh bin/*.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          # The app store requires both. Nothing here is compiled, so arm64 is a plain
          # cross-build of an Alpine image.
          platforms: linux/amd64,linux/arm64
          # Pull requests build to prove the image builds, and push nothing.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
